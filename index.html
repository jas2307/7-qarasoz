<!doctype html>
<html lang="kk">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жетінші Қара Сөз - Тізбек Ойыны</title>
  <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f3460 100%);
            color: #00fff7;
            overflow-x: hidden;
            position: relative;
        }

        html {
            height: 100%;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #00fff7, transparent);
            opacity: 0.1;
            animation: pulse 3s ease-in-out infinite;
        }

        .grid-line.horizontal {
            width: 100%;
            height: 2px;
        }

        .grid-line.vertical {
            width: 2px;
            height: 100%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100%;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #00fff7, 0 0 40px #00fff7;
            margin: 0 0 10px 0;
        }

        .subtitle {
            font-size: 20px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin: 0 0 20px 0;
        }

        .instruction {
            font-size: 16px;
            color: #ffffff;
            opacity: 0.8;
        }

        .progress-bar {
            max-width: 800px;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00fff7;
            border-radius: 20px;
            height: 30px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 247, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00fff7, #ff00ff);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(0, 255, 247, 0.8);
        }

        .game-area {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 600px;
        }

        .connections-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .blocks-container {
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            padding: 20px;
            z-index: 2;
        }

        .block {
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.95), rgba(26, 26, 46, 0.95));
            border: 2px solid #00fff7;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 247, 0.3);
            position: relative;
            overflow: hidden;
            min-height: 140px;
            display: flex;
            align-items: center;
        }

        .block::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00fff7, #ff00ff, #00fff7);
            border-radius: 15px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .block:hover::before {
            opacity: 0.3;
            animation: borderGlow 2s linear infinite;
        }

        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .block:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 30px rgba(0, 255, 247, 0.6);
        }

        .block.correct {
            border-color: #00ff00;
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.2), rgba(26, 26, 46, 0.95));
            animation: correctPulse 0.5s ease;
            cursor: default;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px #00ff00; }
        }

        .block.error {
            animation: errorShake 0.5s ease;
        }

        @keyframes errorShake {
            0%, 100% { 
                transform: translateX(0); 
                border-color: #00fff7;
            }
            10%, 30%, 50%, 70%, 90% { 
                transform: translateX(-8px); 
                border-color: #ff0000;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            }
            20%, 40%, 60%, 80% { 
                transform: translateX(8px); 
                border-color: #ff0000;
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            }
        }

        .block-number {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(0, 255, 0, 0.3);
            border: 2px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        .block.correct .block-number {
            opacity: 1;
            animation: numberPop 0.5s ease;
        }

        @keyframes numberPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .block-text {
            font-size: 17px;
            line-height: 1.7;
            color: #ffffff;
            position: relative;
            z-index: 1;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .success-overlay.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-content {
            text-align: center;
            animation: scaleIn 0.5s ease;
            max-width: 90%;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .success-title {
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00;
            animation: successGlow 2s ease-in-out infinite;
        }

        @keyframes successGlow {
            0%, 100% { text-shadow: 0 0 30px #00ff00, 0 0 60px #00ff00; }
            50% { text-shadow: 0 0 50px #00ff00, 0 0 100px #00ff00; }
        }

        .success-text {
            font-size: 24px;
            margin-bottom: 30px;
            color: #00fff7;
        }

        .reset-btn {
            background: linear-gradient(135deg, #00fff7, #ff00ff);
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 247, 0.5);
        }

        .reset-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 255, 247, 0.8);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 28px;
            }
            .subtitle {
                font-size: 16px;
            }
            .blocks-container {
                grid-template-columns: 1fr;
            }
            .block-text {
                font-size: 15px;
            }
            .success-title {
                font-size: 48px;
            }
            .success-text {
                font-size: 18px;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="animated-bg" id="animatedBg"></div>
  <main class="container">
   <header class="header">
    <h1 class="title" id="gameTitle">Жетінші Қара Сөз</h1>
    <p class="subtitle" id="gameSubtitle">Абай Құнанбайұлы</p>
    <p class="instruction" id="instructionText">Мәтін блоктарын дұрыс ретімен басыңыз</p>
   </header>
   <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
   </div>
   <div class="game-area">
    <svg class="connections-canvas" id="connectionsCanvas"></svg>
    <div class="blocks-container" id="blocksContainer"></div>
   </div>
  </main>
  <div class="success-overlay" id="successOverlay">
   <div class="success-content">
    <div class="success-title">
     🎉 ЖАРАЙСЫЗ! 🎉
    </div>
    <p class="success-text" id="successMessage">Құттықтаймыз! Абайдың даналық сөздерін дұрыс реттедіңіз!</p><button class="reset-btn" onclick="resetGame()">Қайта Бастау</button>
   </div>
  </div>
  <script src="/_sdk/element_sdk.js"></script>
  <script>
        const defaultConfig = {
            game_title: "Жетінші Қара Сөз",
            game_subtitle: "Абай Құнанбайұлы",
            instruction_text: "Мәтін блоктарын дұрыс ретімен басыңыз",
            success_message: "Құттықтаймыз! Абайдың даналық сөздерін дұрыс реттедіңіз!"
        };

        const blocks = [
            { id: 1, text: "Жас бала анадан туғанда екі түрлі мінезбен туады: біреуі - ішсем, жесем, ұйқтасам деп тұрады. Бұлар - тәннің құмары." },
            { id: 2, text: "Біреуі - білсем екен демеклік. Не көрсе соған талпынып, жалтыр-жұлтыр еткен болса, оған қызығып, аузына салып, дәмін татып қарайды." },
            { id: 3, text: "Мұның бәрі - жан құмары, білсем екен, көрсем екен, үйренсем екен деген." },
            { id: 4, text: "Дүниенің көрінген һәм көрінбеген сырын түгелдеп білмесе, адамдықпен орны болмайды. Оны білмеген соң, ол жан хайуан жаны болады." },
            { id: 5, text: "Сол қуат жетпеген бала күндегі 'бұл немене' деп сұрап білсем екен дегенде, ержеткен соң, ақыл кіргенде, ғылым тапқандардың жолына неге салмайды екеміз?" },
            { id: 6, text: "Сол құмарланып жиған қазынамызды көбейтсек керек, бұл жанның тамағы еді. Тәнді жанға бас ұрғызса керек еді." },
            { id: 7, text: "Жоқ, біз олай қылмадық, ұзақтай шулап, қарғадай барқылдап, ауылдағы боқтықтан ұзамадық." },
            { id: 8, text: "Жанды тәнге бас ұрғыздық, ешнәрсеге көңілменен қарамадық, сырын қалай болады деп көңілге салмадық." },
            { id: 9, text: "Біреу ақыл айтса: 'Ой, тәңірі-ай, кімнен кім артық дейсің!' - дейміз, артығын білмейміз, айтып тұрса ұқпаймыз." },
            { id: 10, text: "Көкіректе сәуле жоқ, көңілде сенім жоқ. Құр көзбенен көрген біздің хайуан малдан неміз артық?" },
            { id: 11, text: "Қайта, бала күнімізде жақсы екенбіз. Білсек те, білмесек те, білсек екен деген адамның баласы екенбіз." },
            { id: 12, text: "Енді осы күнде хайуаннан да жаманбыз. Хайуан білмейді, білемін деп таласпайды. Біз түк білмейміз, біз де білеміз деп надандығымызды білімділікке бермей таласамыз." }
        ];

        let gameState = {
            currentStep: 0,
            selectedBlocks: [],
            blockPositions: {}
        };

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSuccessSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
            
            setTimeout(() => {
                const oscillator2 = audioContext.createOscillator();
                const gainNode2 = audioContext.createGain();
                
                oscillator2.connect(gainNode2);
                gainNode2.connect(audioContext.destination);
                
                oscillator2.frequency.value = 1000;
                oscillator2.type = 'sine';
                
                gainNode2.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator2.start(audioContext.currentTime);
                oscillator2.stop(audioContext.currentTime + 0.3);
            }, 100);
        }

        function playErrorSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 200;
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function updateProgress() {
            const progress = (gameState.currentStep / blocks.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
        }

        function initializeGame() {
            const shuffled = shuffleArray(blocks);
            const container = document.getElementById('blocksContainer');
            container.innerHTML = '';
            
            shuffled.forEach(block => {
                const blockEl = document.createElement('div');
                blockEl.className = 'block';
                blockEl.dataset.id = block.id;
                blockEl.innerHTML = `
                    <div class="block-number">${block.id}</div>
                    <div class="block-text">${block.text}</div>
                `;
                blockEl.onclick = () => handleBlockClick(block.id);
                container.appendChild(blockEl);
            });

            setTimeout(updateBlockPositions, 100);
        }

        function updateBlockPositions() {
            gameState.blockPositions = {};
            const blockElements = document.querySelectorAll('.block');
            blockElements.forEach(block => {
                const rect = block.getBoundingClientRect();
                const container = document.getElementById('blocksContainer').getBoundingClientRect();
                gameState.blockPositions[block.dataset.id] = {
                    x: rect.left - container.left + rect.width / 2,
                    y: rect.top - container.top + rect.height / 2
                };
            });
        }

        function drawConnection(fromId, toId) {
            const svg = document.getElementById('connectionsCanvas');
            const from = gameState.blockPositions[fromId];
            const to = gameState.blockPositions[toId];
            
            if (!from || !to) return;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', from.x);
            line.setAttribute('y1', from.y);
            line.setAttribute('x2', to.x);
            line.setAttribute('y2', to.y);
            line.setAttribute('stroke', '#00ff00');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-dasharray', '10,5');
            line.style.filter = 'drop-shadow(0 0 10px #00ff00)';
            line.style.opacity = '0';
            line.style.transition = 'opacity 0.5s ease';
            
            svg.appendChild(line);
            
            setTimeout(() => {
                line.style.opacity = '1';
                
                const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animate.setAttribute('attributeName', 'stroke-dashoffset');
                animate.setAttribute('from', '15');
                animate.setAttribute('to', '0');
                animate.setAttribute('dur', '1s');
                animate.setAttribute('repeatCount', 'indefinite');
                line.appendChild(animate);
            }, 50);
        }

        function handleBlockClick(blockId) {
            const expectedId = gameState.currentStep + 1;
            const blockEl = document.querySelector(`[data-id="${blockId}"]`);
            
            if (blockEl.classList.contains('correct')) {
                return;
            }
            
            if (blockId === expectedId) {
                playSuccessSound();
                blockEl.classList.add('correct');
                gameState.selectedBlocks.push(blockId);
                gameState.currentStep++;
                updateProgress();
                
                if (gameState.currentStep > 1) {
                    drawConnection(gameState.selectedBlocks[gameState.currentStep - 2], blockId);
                }
                
                if (gameState.currentStep === blocks.length) {
                    setTimeout(() => {
                        document.getElementById('successOverlay').classList.add('active');
                    }, 1000);
                }
            } else {
                playErrorSound();
                blockEl.classList.add('error');
                setTimeout(() => {
                    blockEl.classList.remove('error');
                }, 500);
            }
        }

        function resetGame() {
            gameState = {
                currentStep: 0,
                selectedBlocks: [],
                blockPositions: {}
            };
            
            document.getElementById('successOverlay').classList.remove('active');
            document.getElementById('connectionsCanvas').innerHTML = '';
            updateProgress();
            initializeGame();
        }

        function createAnimatedBackground() {
            const bg = document.getElementById('animatedBg');
            
            for (let i = 0; i < 5; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line horizontal';
                line.style.top = `${20 + i * 20}%`;
                line.style.animationDelay = `${i * 0.3}s`;
                bg.appendChild(line);
            }
            
            for (let i = 0; i < 8; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line vertical';
                line.style.left = `${10 + i * 12}%`;
                line.style.animationDelay = `${i * 0.2}s`;
                bg.appendChild(line);
            }
        }

        async function onConfigChange(config) {
            document.getElementById('gameTitle').textContent = config.game_title || defaultConfig.game_title;
            document.getElementById('gameSubtitle').textContent = config.game_subtitle || defaultConfig.game_subtitle;
            document.getElementById('instructionText').textContent = config.instruction_text || defaultConfig.instruction_text;
            document.getElementById('successMessage').textContent = config.success_message || defaultConfig.success_message;
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig: defaultConfig,
                onConfigChange: onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [],
                    borderables: [],
                    fontEditable: undefined,
                    fontSizeable: undefined
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["game_title", config.game_title || defaultConfig.game_title],
                    ["game_subtitle", config.game_subtitle || defaultConfig.game_subtitle],
                    ["instruction_text", config.instruction_text || defaultConfig.instruction_text],
                    ["success_message", config.success_message || defaultConfig.success_message]
                ])
            });
        }

        window.addEventListener('resize', () => {
            updateBlockPositions();
            document.getElementById('connectionsCanvas').innerHTML = '';
            for (let i = 1; i < gameState.selectedBlocks.length; i++) {
                drawConnection(gameState.selectedBlocks[i-1], gameState.selectedBlocks[i]);
            }
        });
        
        createAnimatedBackground();
        initializeGame();
    </script>
